# Example load balancer in front of several app instances (python serve.py).
# This is an http-context fragment: include it from the http {} block of nginx.conf.
# Verified by tests/test_nginx.py against a real nginx 1.24 (with the listen port
# and upstream ports swapped for free ports).
#
# Run each instance with:
#   TRUSTED_PROXIES=1   so rate limiting sees the real client IP from X-Forwarded-For
#   AUTO_MIGRATE=0      and run `alembic upgrade head` once per deploy instead
#   METRICS_TOKEN=...   so /metrics needs a bearer token
#   DATABASE_URL, UPLOAD_FOLDER or STORAGE_BACKEND=s3 shared by all instances

upstream visual_assistant {
    least_conn;                       # streams are long-lived; balance by open connections
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 16m;         # matches MAX_CONTENT_LENGTH

    # Overwrite, never append: the app trusts exactly one proxy hop.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://visual_assistant;
        proxy_next_upstream error timeout http_503;
    }

    # Server-Sent Events: no buffering, long read timeout, pass Last-Event-ID through.
    location /chat-stream/ {
        proxy_pass http://visual_assistant;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Monitoring endpoints are not for the public internet. Scrape each
    # instance directly on its own port; metrics are per instance.
    location = /metrics { deny all; }
    location = /health  { allow 10.0.0.0/8; allow 127.0.0.1; deny all; proxy_pass http://visual_assistant; }
}
